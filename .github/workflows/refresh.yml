name: Refresh showtimes and deploy

on:
  schedule:
    - cron: "0 9 * * *"    # every day at 09:00 UTC (5 AM Eastern in summer, 4 AM in winter)
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover pipeline
      - name: Fetch showtimes and build
        env:
          SHOWTIMES_PROVIDER: ${{ vars.SHOWTIMES_PROVIDER }}        # repo variable; empty uses config.json
          ISHOWTIMES_API_KEY: ${{ secrets.ISHOWTIMES_API_KEY }}
        run: python pipeline/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
